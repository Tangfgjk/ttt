services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${HOST_MYSQL_DIR}:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ttt-net

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - ${HOST_REDIS_DIR}:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ttt-net

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    volumes:
      - ${HOST_UPLOADS_DIR}:/data/uploads
      - ${HOST_ARTIFACTS_DIR}:/data/artifacts
      - ${HOST_MODELS_DIR}:/data/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ttt-net

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - celery
      - -A
      - app.tasks.celery_app:celery_app
      - worker
      - --loglevel=INFO
    volumes:
      - ${HOST_UPLOADS_DIR}:/data/uploads
      - ${HOST_ARTIFACTS_DIR}:/data/artifacts
      - ${HOST_MODELS_DIR}:/data/models:ro
    networks:
      - ttt-net

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-migrate
    profiles:
      - tools
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    volumes:
      - ${HOST_UPLOADS_DIR}:/data/uploads
      - ${HOST_ARTIFACTS_DIR}:/data/artifacts
      - ${HOST_MODELS_DIR}:/data/models:ro
    networks:
      - ttt-net

  nginx:
    image: nginx:1.27-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ${HOST_FRONTEND_DIST_DIR}:/usr/share/nginx/html:ro
      - ../docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ttt-net

networks:
  ttt-net:
    name: ${COMPOSE_PROJECT_NAME:-ttt}-net
