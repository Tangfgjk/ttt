services:
  mysql:
    image: mysql:8.4
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - ${HOST_MYSQL_DIR}:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ttt-net

  backend:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PYPI_TRUSTED_HOST: ${PYPI_TRUSTED_HOST:-mirrors.aliyun.com}
        INSTALL_ML: ${INSTALL_ML:-true}
        TORCH_PACKAGE: ${TORCH_PACKAGE:-torch==2.3.1+cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    expose:
      - "8000"
    volumes:
      - ${HOST_UPLOADS_DIR}:/data/uploads
      - ${HOST_ARTIFACTS_DIR}:/data/artifacts
      - ${HOST_MODELS_DIR}:/data/models:ro
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/system/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ttt-net

  migrate:
    build:
      context: ../..
      dockerfile: deploy/docker/backend/Dockerfile
      args:
        PYPI_INDEX_URL: ${PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PYPI_TRUSTED_HOST: ${PYPI_TRUSTED_HOST:-mirrors.aliyun.com}
        INSTALL_ML: "false"
        TORCH_PACKAGE: ${TORCH_PACKAGE:-torch==2.3.1+cpu}
        TORCH_INDEX_URL: ${TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-migrate
    profiles:
      - tools
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    command:
      - alembic
      - upgrade
      - head
    volumes:
      - ${HOST_UPLOADS_DIR}:/data/uploads
      - ${HOST_ARTIFACTS_DIR}:/data/artifacts
      - ${HOST_MODELS_DIR}:/data/models:ro
    networks:
      - ttt-net

  nginx:
    build:
      context: ../..
      dockerfile: deploy/docker/frontend/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-ttt}-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    networks:
      - ttt-net

networks:
  ttt-net:
    name: ${COMPOSE_PROJECT_NAME:-ttt}-net
